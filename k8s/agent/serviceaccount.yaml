apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-sa
  namespace: sre-ai-agent-llm
  annotations:
    # IRSA: binds this SA to the IAM role that allows Bedrock InvokeModel.
    # Role ARN is injected by deploy-agent.sh from terraform output.
    eks.amazonaws.com/role-arn: PLACEHOLDER_AGENT_ROLE_ARN
