apiVersion: v1
kind: Service
metadata:
  name: sre-agent
  namespace: sre-ai-agent-llm
spec:
  # ClusterIP — agent is internal only, called by the app pod or alert webhooks.
  # Not exposed via LoadBalancer; use kubectl port-forward for local testing.
  type: ClusterIP
  selector:
    app: sre-agent
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
